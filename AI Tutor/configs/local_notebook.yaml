model:
  type: akt
  d_model: 128
  n_heads: 8
  n_layers: 3
  dropout: 0.2
  ff_multiplier: 4
training:
  epochs: 23
  batch_size: 96
  lr: 0.001
  weight_decay: 0.01
  patience: 5
  num_workers: 0
  mixed_precision: true
  grad_clip: 1.0
  scheduler: cosine
  save_every_epoch: true
  pin_memory: true
rag:
  backend: turbovec
  collection_name: ai_tutor_rag_datasets_local_v2
  embedding_backend: auto
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  turbovec_bits: 3
  hashing_features: 1024
  chunk_size: 900
  chunk_overlap: 150
  top_k: 4
  rebuild_index: false
  max_file_mb: 50
  max_files: 120
  max_chunks: 25000
  max_chars_per_file: 500000
tutor:
  mode: turboquant
  openai_model: gpt-4.1-mini
  local_model: Qwen/Qwen2.5-0.5B-Instruct
  turboquant_model: Qwen/Qwen2.5-0.5B-Instruct
  turboquant_base_url: null
  turboquant_bits: 4
  max_new_tokens: 220
  temperature: 0.4
  quantization: turboquant
  allow_direct_answer: false
  hint_mode: true
evaluation:
  rag_top_k: 4
  notes: Local EdNet-only AKT + RAG + Socratic tutor baseline using Datasets (Organized)
    when available.
benchmark:
  akt_batches: 20
  onnx_batches: 50
  run_local_llm: false
  run_api_llm: false
