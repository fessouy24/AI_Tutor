environment: kaggle
seed: 42

paths:
  data_root: "{kaggle_input}"
  dataset_path_candidates:
    - "{kaggle_input}/datasets/EdNet-Contents/contents/questions.csv"
    - "{kaggle_working}/downloaded_datasets/kagglehub/ednet_contents/contents/questions.csv"
    - "{kaggle_input}/datasets/gmhost/ednetkt1/KT1"
    - "{kaggle_working}/downloaded_datasets/kagglehub/ednet_kt1/KT1"
    - "{kaggle_input}/datasets/anhtu96/ednet-kt34/KT3"
  processed_dir: "{kaggle_working}/outputs/processed"
  checkpoints_dir: "{kaggle_working}/checkpoints"
  outputs_dir: "{kaggle_working}/outputs"
  logs_dir: "{kaggle_working}/logs"
  rag_docs_dir: "{kaggle_input}/datasets/RAG_Datasets"
  rag_index_dir: "{kaggle_working}/outputs/rag_index_datasets"
  retrieval_log: "{kaggle_working}/outputs/retrieval_logs.jsonl"
  tutor_log: "{kaggle_working}/outputs/tutor_logs.jsonl"
  explanations_dir: "{kaggle_working}/outputs/explanations"

data:
  dataset_name: "ednet_kt1_kt2_kt3_kt4"
  use_multi_source: true
  kt_sources:
    - name: "ednet_kt1"
      type: "ednet_folder"
      path_candidates:
        - "{kaggle_input}/datasets/gmhost/ednetkt1"
        - "{kaggle_working}/downloaded_datasets/kagglehub/ednet_kt1"
      correct_answer_path_candidates:
        - "{kaggle_input}/datasets/EdNet-Contents/contents/questions.csv"
        - "{kaggle_working}/downloaded_datasets/kagglehub/ednet_contents/contents/questions.csv"
      enabled: true
      required: false
    - name: "ednet_kt34_converted"
      type: "supervised_folder"
      path_candidates:
        - "{kaggle_working}/downloaded_datasets/kagglehub/ednet_kt34_feather_csv"
        - "{kaggle_working}/downloaded_datasets/kagglehub/ednet_kt34"
        - "{kaggle_input}/datasets/anhtu96/ednet-kt34"
      file_patterns:
        - "*.csv"
        - "*.feather"
        - "*.parquet"
      max_files: 8
      max_file_mb: 800
      enabled: true
    - name: "ednet_kt2_uploaded"
      type: "ednet_folder"
      path_candidates:
        - "{kaggle_input}/datasets/youssefelfarran/my-ai-tutor-datasets/My_AI_Tutor_Datasets/KT2"
        - "{kaggle_working}/extracted_data/My_AI_Tutor_Datasets/KT2"
      correct_answer_path_candidates:
        - "{kaggle_input}/datasets/EdNet-Contents/contents/questions.csv"
        - "{kaggle_working}/downloaded_datasets/kagglehub/ednet_contents/contents/questions.csv"
      enabled: true
  max_rows:
  column_overrides: {}
  min_seq_len: 3
  max_seq_len: 200
  stride: 200
  require_all_kt_sources: true
  ednet_progress_every_files: 1000
  processed_cache_path: outputs/processed/kt_processed_ednet_only.pt
  cache_sources: true
  cache_processed: true
  rebuild_cache: false
  split:
    train: 0.8
    val: 0.1
    test: 0.1

model:
  type: "akt"
  d_model: 128
  n_heads: 8
  n_layers: 3
  dropout: 0.2
  ff_multiplier: 4

training:
  epochs: 20
  batch_size: 96
  lr: 0.001
  weight_decay: 0.01
  patience: 5
  num_workers: 2
  mixed_precision: true
  grad_clip: 1.0
  scheduler: "cosine"
  save_every_epoch: true
  pin_memory: true

rag:
  backend: "turbovec"
  collection_name: "ai_tutor_rag_datasets"
  embedding_backend: "auto"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  turbovec_bits: 3
  hashing_features: 1024
  chunk_size: 900
  chunk_overlap: 150
  top_k: 4
  rebuild_index: false
  max_file_mb: 50
  max_files: 120
  max_chunks: 25000
  max_chars_per_file: 500000

tutor:
  mode: "auto"
  openai_model: "gpt-4.1-mini"
  local_model: "Qwen/Qwen2.5-0.5B-Instruct"
  turboquant_model: "Qwen/Qwen2.5-0.5B-Instruct"
  turboquant_base_url:
  turboquant_bits: 4
  max_new_tokens: 220
  temperature: 0.4
  quantization: "turboquant"
  allow_direct_answer: false
  hint_mode: true

evaluation:
  rag_top_k: 4
  notes: "Kaggle AKT-style baseline with checkpoint recovery and VRAM cleanup."

benchmark:
  akt_batches: 20
  onnx_batches: 50
  run_local_llm: false
  run_api_llm: false

research:
  agentic_samples: 3
  build_rag_index_if_missing: false
  benchmark_runs: 30
  notes: "Kaggle research improvement phase with safe defaults; heavy RAG/LLM experiments are opt-in."
